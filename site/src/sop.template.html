<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSCH Staff SOP</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="/logo-64.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/base.css">
<style>
  .doc { display: grid; grid-template-columns: 276px minmax(0, 1fr); gap: 52px; align-items: start; padding: 34px 0 0; }

  /* ---- section rail ---- */
  .rail { position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 120px); display: flex; flex-direction: column; }
  .rail input {
    width: 100%; padding: 10px 12px; font: 400 14.5px Barlow, sans-serif;
    background: var(--deep); color: var(--text); border: 1px solid var(--line);
  }
  .rail input::placeholder { color: var(--dim); }
  .rail nav { overflow-y: auto; margin-top: 14px; padding-right: 6px; }
  .rail a {
    display: block; padding: 6px 0 6px 13px; font-size: 14px; line-height: 1.35;
    color: var(--dim); text-decoration: none; border-left: 2px solid var(--line);
  }
  .rail a.sub { padding-left: 25px; font-size: 13.2px; }
  .rail a:hover { color: var(--text); }
  .rail a.here { color: var(--text); border-left-color: var(--blue); font-weight: 600; }
  .rail a[hidden] { display: none; }
  .rail .count { margin-top: 10px; font: 400 12.5px "IBM Plex Mono", monospace; color: var(--dim); }

  /* ---- document ---- */
  .doc article { max-width: 76ch; padding-bottom: 90px; }
  .doc article h1 { font-size: clamp(2rem, 4.4vw, 2.9rem); margin-top: 18px; }
  .doc article h2 {
    font-size: clamp(1.5rem, 3vw, 2rem); margin: 58px 0 0; padding-top: 24px;
    border-top: 2px solid var(--line);
  }
  .doc article h3 { font-size: 1.15rem; margin: 36px 0 0; text-transform: none; letter-spacing: -0.01em; }
  .doc article p, .doc article li { font-size: 16px; color: #dbe6fb; }
  .doc article p { margin: 14px 0 0; }
  .doc article ul, .doc article ol { margin: 14px 0 0; padding-left: 22px; }
  .doc article li { margin: 7px 0; }
  .doc article strong { font-weight: 700; color: var(--text); }
  .doc article code { background: var(--deep); border: 1px solid var(--line); padding: 1px 6px; color: var(--blue-soft); }
  .doc article a { color: var(--blue-soft); }
  .doc article hr { display: none; }
  .doc article blockquote {
    margin: 22px 0 0; padding: 14px 18px; border-left: 4px solid var(--blue);
    background: var(--deep); color: var(--dim); font-size: 15.4px;
  }
  .doc article blockquote p:first-child { margin: 0; }
  .doc article table { border-collapse: collapse; width: 100%; margin: 20px 0 0; font-size: 14.6px; }
  .doc article th, .doc article td { border: 1px solid var(--line); padding: 9px 11px; text-align: left; vertical-align: top; }
  .doc article th { background: var(--deep); font-weight: 700; }
  .table-wrap { overflow-x: auto; }

  .anchor { opacity: 0; margin-left: 9px; font-size: 0.62em; text-decoration: none; color: var(--dim); }
  h2:hover .anchor, h3:hover .anchor, .anchor:focus-visible { opacity: 1; }

  .sheet-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .sheet-head p { margin: 0; color: var(--dim); font-size: 14.5px; }
  .stamp {
    border: 2px solid var(--blue); color: var(--blue-soft);
    font: 500 11.5px/1 "IBM Plex Mono", monospace; letter-spacing: .16em; padding: 7px 10px;
  }
  .no-match { display: none; color: var(--dim); padding: 30px 0; }

  @media (max-width: 900px) {
    .doc { grid-template-columns: 1fr; gap: 22px; }
    .rail { position: static; max-height: none; }
    .rail nav { max-height: 210px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="shell">
    <a class="mark" href="/"><img src="/logo-64.png" alt="" width="34" height="34"><span>BSCH</span></a>
    <nav>
      <a href="/flow.html">Full process</a>
      <a href="/">Public site</a>
      <a class="hire" href="__DISCORD__">Hire us</a>
    </nav>
  </div>
</header>

<main class="shell doc">
  <aside class="rail">
    <label class="visually-hidden" for="filter">Filter sections</label>
    <input id="filter" type="search" placeholder="Filter sections…" autocomplete="off">
    <nav id="toc">__TOC__</nav>
    <p class="count" id="count"></p>
  </aside>

  <article id="sop">
    <div class="sheet-head">
      <span class="stamp">STAFF ONLY</span>
      <p>Updated __UPDATED__ · straight from the bot's own repo</p>
    </div>
    __BODY__
    <p class="no-match" id="nomatch">Nothing in the SOP matches that.</p>
  </article>
</main>

<script>
const toc = document.getElementById('toc');
const links = [...toc.querySelectorAll('a')];
const filter = document.getElementById('filter');
const count = document.getElementById('count');
const nomatch = document.getElementById('nomatch');

// Each heading owns everything up to the next heading of the same or higher rank
function sectionOf(heading) {
  const stop = heading.tagName === 'H2' ? ['H2'] : ['H2', 'H3'];
  const nodes = [heading];
  let el = heading.nextElementSibling;
  while (el && !stop.includes(el.tagName)) { nodes.push(el); el = el.nextElementSibling; }
  return nodes;
}

const sections = links.map(a => {
  const heading = document.getElementById(a.hash.slice(1));
  return { link: a, heading, nodes: sectionOf(heading), text: (heading.textContent + ' ' + sectionOf(heading).map(n => n.textContent).join(' ')).toLowerCase() };
});

filter.addEventListener('input', () => {
  const q = filter.value.trim().toLowerCase();
  let shown = 0;
  for (const s of sections) {
    const hit = !q || s.text.includes(q);
    if (hit) shown++;
    s.link.hidden = !hit;
    for (const n of s.nodes) n.hidden = !hit;
  }
  count.textContent = q ? `${shown} of ${sections.length} sections` : '';
  nomatch.style.display = q && shown === 0 ? 'block' : 'none';
});

// Highlight whichever section you're reading
const seen = new Set();
const spy = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (e.isIntersecting) seen.add(e.target.id); else seen.delete(e.target.id);
  }
  const first = sections.find(s => seen.has(s.heading.id));
  links.forEach(a => a.classList.remove('here'));
  if (first) first.link.classList.add('here');
}, { rootMargin: '-80px 0px -70% 0px' });
sections.forEach(s => spy.observe(s.heading));

// Copy a link straight to one section
document.addEventListener('click', async e => {
  const anchor = e.target.closest('.anchor');
  if (!anchor) return;
  e.preventDefault();
  const url = location.origin + location.pathname + anchor.getAttribute('href');
  history.replaceState(null, '', anchor.getAttribute('href'));
  try {
    await navigator.clipboard.writeText(url);
    const was = anchor.textContent;
    anchor.textContent = 'copied';
    setTimeout(() => { anchor.textContent = was; }, 1200);
  } catch { location.hash = anchor.getAttribute('href'); }
});
</script>
</body>
</html>
